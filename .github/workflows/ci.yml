name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call: # run by release.yml before publishing
  schedule:
    - cron: "17 4 * * 1" # weekly, to catch changes in the Firebird 6 snapshot

jobs:
  test:
    name: test (Firebird ${{ matrix.firebird }})
    runs-on: ubuntu-latest
    # Firebird 6 is not released yet: its nightly snapshot may break at any
    # time, so a failure there is reported but doesn't fail the run.
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        firebird: ["3", "4", "5"]
        experimental: [false]
        charset: [""]
        include:
          # The snapshot truncates CHARACTER SET NONE columns for UTF8 clients
          # that describe rows in BLR, so its database gets a real charset.
          - firebird: 6-snapshot
            experimental: true
            charset: UTF8
    services:
      firebird:
        image: firebirdsql/firebird:${{ matrix.firebird }}
        env:
          FIREBIRD_ROOT_PASSWORD: masterkey
          FIREBIRD_DATABASE: test.fdb
          FIREBIRD_DATABASE_DEFAULT_CHARSET: ${{ matrix.charset }}
        ports:
          - 3050:3050
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Load example database
        run: |
          for i in $(seq 1 30); do
            docker exec ${{ job.services.firebird.id }} test -f /var/lib/firebird/data/test.fdb && break
            sleep 2
          done
          sleep 3
          docker cp examples/bookstore.sql ${{ job.services.firebird.id }}:/tmp/bookstore.sql
          docker exec ${{ job.services.firebird.id }} /opt/firebird/bin/isql \
            -user SYSDBA -password masterkey localhost:/var/lib/firebird/data/test.fdb -i /tmp/bookstore.sql
          if [ "${{ matrix.firebird }}" != "3" ]; then  # time zone types: Firebird 4+
            docker cp examples/bookstore-fb4.sql ${{ job.services.firebird.id }}:/tmp/bookstore-fb4.sql
            docker exec ${{ job.services.firebird.id }} /opt/firebird/bin/isql \
              -user SYSDBA -password masterkey localhost:/var/lib/firebird/data/test.fdb -i /tmp/bookstore-fb4.sql
          fi
          case "${{ matrix.firebird }}" in 6*)  # SQL schemas: Firebird 6+
            docker cp examples/bookstore-fb6.sql ${{ job.services.firebird.id }}:/tmp/bookstore-fb6.sql
            docker exec ${{ job.services.firebird.id }} /opt/firebird/bin/isql \
              -user SYSDBA -password masterkey localhost:/var/lib/firebird/data/test.fdb -i /tmp/bookstore-fb6.sql
          esac
      - name: Vet
        run: go vet ./...
      - name: Test
        env:
          FBREST_TEST_DB_URI: authenticator:authenticator@localhost:3050/var/lib/firebird/data/test.fdb
        run: go test -race -count=1 ./...

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t firebirdrest .
