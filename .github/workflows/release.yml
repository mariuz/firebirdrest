name: Release

# Two ways to release:
#  - push a tag:       git tag -a v0.2.0 -m v0.2.0 && git push origin v0.2.0
#  - from GitHub:      Actions -> Release -> Run workflow, enter the version (e.g. 0.2.0).
#                      The tag is created on the selected branch after the tests pass.
# See RELEASING.md for the steps and the optional Docker Hub / Homebrew / Scoop settings.
# Before releasing, move the [Unreleased] entries of CHANGELOG.md under "## [x.y.z] - date":
# that section becomes the release notes (replacing any text already on the GitHub release).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 0.2.0 or 0.2.0-rc1"
        required: true

permissions:
  contents: write
  packages: write

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  tag:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - id: tag
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          v="${INPUT_VERSION#v}"
          if ! echo "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "::error::'$INPUT_VERSION' is not a semantic version like 0.2.0"
            exit 1
          fi
          tag="v$v"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "::error::tag $tag already exists"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "FirebirdREST $tag"
          git push origin "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  binaries:
    needs: tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.tag.outputs.tag }}
          fetch-depth: 0 # the changelog needs the full history
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Release notes from CHANGELOG.md
        env:
          TAG: ${{ needs.tag.outputs.tag }}
        run: |
          v="${TAG#v}"
          # the "## [x.y.z]" section, up to the next "## [" heading
          awk -v v="$v" '
            index($0, "## [" v "]") == 1 { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if [ -z "$(tr -d '[:space:]' < "$RUNNER_TEMP/notes.md")" ]; then
            echo "::warning::CHANGELOG.md has no section for $v; the release notes list the commits instead"
            echo "args=release --clean" >> "$GITHUB_ENV"
          else
            echo "args=release --clean --release-notes $RUNNER_TEMP/notes.md" >> "$GITHUB_ENV"
          fi
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: ${{ env.args }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # write access to mariuz/homebrew-tap and mariuz/scoop-bucket; without
          # it the Homebrew cask and Scoop manifest are not published
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}

  docker:
    needs: tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.tag.outputs.tag }}
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Docker Hub too, once the repository variable DOCKERHUB_USERNAME and the
      # secret DOCKERHUB_TOKEN (an access token with write access) are set
      - if: ${{ vars.DOCKERHUB_USERNAME != '' }}
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/${{ github.repository }}
            ${{ vars.DOCKERHUB_USERNAME != '' && format('docker.io/{0}/firebirdrest', vars.DOCKERHUB_USERNAME) || '' }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.tag.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.tag.outputs.tag }}
            type=raw,value=latest,enable=${{ !contains(needs.tag.outputs.tag, '-') }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ needs.tag.outputs.tag }}
