# Release configuration: https://goreleaser.com
# Test locally with: goreleaser release --snapshot --clean
version: 2

project_name: firebirdrest

before:
  hooks:
    - go mod tidy

builds:
  - id: firebirdrest
    main: ./cmd/firebirdrest
    binary: firebirdrest
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/mariuz/firebirdrest/internal/server.Version={{ .Tag }}
    goos: [linux, darwin, windows, freebsd]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - id: default
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE
      - CHANGELOG.md
      - examples/*

# Debian/Ubuntu and RHEL/Fedora/SUSE packages: the binary, a systemd unit and a
# configuration in /etc/firebirdrest (kept on upgrade), run as the firebirdrest user.
nfpms:
  - id: packages
    package_name: firebirdrest
    file_name_template: "{{ .PackageName }}_{{ .Version }}_{{ .Arch }}"
    ids: [firebirdrest]
    formats: [deb, rpm]
    vendor: FirebirdREST
    homepage: https://mariuz.github.io/firebirdrest/
    maintainer: Marius Popa <mapopa@gmail.com>
    description: |-
      Serve a RESTful API from any Firebird database.
      FirebirdREST turns a Firebird 3, 4, 5 or 6 database into a REST API with
      PostgREST's URL grammar: filtering, embedding, aggregates, writes, stored
      procedures, Firebird roles from JWTs, OpenAPI, metrics and traces.
    license: MIT
    section: database
    priority: optional
    bindir: /usr/bin
    contents:
      - src: packaging/firebirdrest.service
        dst: /usr/lib/systemd/system/firebirdrest.service
        file_info:
          mode: 0644
      - dst: /etc/firebirdrest
        type: dir
        file_info:
          mode: 0750
      - src: packaging/firebirdrest.conf
        dst: /etc/firebirdrest/firebirdrest.conf
        type: config|noreplace
        file_info:
          mode: 0640
      - src: README.md
        dst: /usr/share/doc/firebirdrest/README.md
      - src: CHANGELOG.md
        dst: /usr/share/doc/firebirdrest/CHANGELOG.md
      - src: LICENSE
        dst: /usr/share/doc/firebirdrest/copyright
      - src: examples/*.sql
        dst: /usr/share/doc/firebirdrest/examples/
    scripts:
      preinstall: packaging/scripts/preinstall.sh
      postinstall: packaging/scripts/postinstall.sh
      preremove: packaging/scripts/preremove.sh
      postremove: packaging/scripts/postremove.sh
    overrides:
      deb:
        dependencies: [passwd]
      rpm:
        dependencies: [shadow-utils]
        file_name_template: "{{ .PackageName }}-{{ .Version }}.{{ if eq .Arch \"amd64\" }}x86_64{{ else if eq .Arch \"arm64\" }}aarch64{{ else }}{{ .Arch }}{{ end }}"

checksum:
  name_template: checksums.txt

# Homebrew (macOS) and Scoop (Windows) packages, published to their own repositories
# with TAP_GITHUB_TOKEN; skipped when the token is not set.
homebrew_casks:
  - name: firebirdrest
    binaries: [firebirdrest]
    homepage: https://mariuz.github.io/firebirdrest/
    description: Serve a RESTful API from any Firebird database
    license: MIT
    repository:
      owner: mariuz
      name: homebrew-tap
      token: '{{ envOrDefault "TAP_GITHUB_TOKEN" "" }}'
    skip_upload: '{{ if eq (envOrDefault "TAP_GITHUB_TOKEN" "") "" }}true{{ else }}false{{ end }}'
    commit_author:
      name: github-actions[bot]
      email: 41898282+github-actions[bot]@users.noreply.github.com
    hooks:
      post:
        # the binaries are not notarized: let macOS run them
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/firebirdrest"]
          end

scoops:
  - name: firebirdrest
    homepage: https://mariuz.github.io/firebirdrest/
    description: Serve a RESTful API from any Firebird database
    license: MIT
    repository:
      owner: mariuz
      name: scoop-bucket
      token: '{{ envOrDefault "TAP_GITHUB_TOKEN" "" }}'
    skip_upload: '{{ if eq (envOrDefault "TAP_GITHUB_TOKEN" "") "" }}true{{ else }}false{{ end }}'
    commit_author:
      name: github-actions[bot]
      email: 41898282+github-actions[bot]@users.noreply.github.com

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  use: git
  sort: asc
  filters:
    exclude:
      - "^ci:"
      - "^docs:"
      - "^test:"

release:
  github:
    owner: mariuz
    name: firebirdrest
  prerelease: auto
  # a release drafted on GitHub first gets these notes instead of its own text
  mode: replace
  header: |
    Binaries for Linux, macOS, Windows and FreeBSD, and .deb and .rpm packages with a systemd
    service, are attached below. The Docker image is
    `ghcr.io/mariuz/firebirdrest:{{ .Version }}`. See [CHANGELOG.md](https://github.com/mariuz/firebirdrest/blob/{{ .Tag }}/CHANGELOG.md) for details.
