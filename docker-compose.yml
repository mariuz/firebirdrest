# Try FirebirdREST with the example bookstore database:
#
#   docker compose up --build
#   curl 'http://localhost:3000/books?select=title,authors(name)'
#
services:
  firebird:
    image: firebirdsql/firebird:5
    environment:
      FIREBIRD_ROOT_PASSWORD: masterkey
      FIREBIRD_DATABASE: bookstore.fdb
    volumes:
      # run in name order: the schema first, then the Firebird 4+ additions
      - ./examples/bookstore.sql:/docker-entrypoint-initdb.d/10-bookstore.sql:ro
      - ./examples/bookstore-fb4.sql:/docker-entrypoint-initdb.d/20-bookstore-fb4.sql:ro
      - fbdata:/var/lib/firebird/data
    ports:
      - "3050:3050"

  firebirdrest:
    build: .
    depends_on:
      - firebird
    environment:
      FBREST_DB_URI: authenticator:authenticator@firebird:3050/var/lib/firebird/data/bookstore.fdb
      FBREST_DB_ANON_ROLE: web_anon
      # change this! at least 32 characters
      FBREST_JWT_SECRET: reallyreallyreallyreallyverysafe1234
      FBREST_ADMIN_SERVER_PORT: "3001"
    ports:
      - "3000:3000"
      - "3001:3001"

  swagger:
    image: swaggerapi/swagger-ui
    environment:
      API_URL: http://localhost:3000/
    ports:
      - "8080:8080"

volumes:
  fbdata:
