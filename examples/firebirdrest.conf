# FirebirdREST configuration. Every key can also be set as an environment
# variable: db-uri -> FBREST_DB_URI, jwt-secret -> FBREST_JWT_SECRET, ...
# Start with: firebirdrest firebirdrest.conf

# user:password@host:port/path/to/database.fdb  (extra driver options: ?wire_crypt=false&charset=UTF8)
db-uri = "authenticator:authenticator@localhost:3050/var/lib/firebird/data/bookstore.fdb"

# Firebird role used for requests without a JWT. Leave empty to require a token.
db-anon-role = "web_anon"

# Connections per role
db-pool = 10

# Hard cap on rows returned by a read (0 = no limit)
db-max-rows = 1000

# Executable procedure run at the start of every request (may raise an EXCEPTION to refuse it)
# db-pre-request = "check_request"

# Refuse PATCH/DELETE without filters
db-safe-updates = true

# Allow count(), sum(), avg(), min(), max() in select
db-aggregates-enabled = true

# POST_EVENT name that reloads the schema cache (empty to disable)
db-reload-event = "fbrest_reload"

# HMAC secret (>= 32 chars), or a PEM public key for RS*/ES* tokens
jwt-secret = "reallyreallyreallyreallyverysafe1234"
# jwt-aud = "my-app"
# Where to find the role in the JWT; dotted paths are allowed
jwt-role-claim-key = "role"

server-host = "0.0.0.0"
server-port = 3000
# Health and reload endpoints: /live, /ready, POST /reload
admin-server-port = 3001
server-cors-allowed-origins = "*"
# openapi-server-proxy-uri = "https://api.example.com"
log-level = "info"
