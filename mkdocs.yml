site_name: FirebirdREST
site_description: Serve a RESTful API from any Firebird database
site_url: https://mariuz.github.io/firebirdrest/
repo_url: https://github.com/mariuz/firebirdrest
repo_name: mariuz/firebirdrest
edit_uri: edit/main/docs/
copyright: MIT licensed. API design after PostgREST.
exclude_docs: |
  requirements.txt

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep orange
      accent: amber
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep orange
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Light mode
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.highlight
    - content.code.copy
    - content.action.edit
  icon:
    repo: fontawesome/brands/github

nav:
  - Home: index.md
  - Tutorials:
      - Getting started: tutorials/getting-started.md
      - Authentication: tutorials/authentication.md
  - API:
      - Reading tables: api/reading.md
      - Resource embedding: api/embedding.md
      - Aggregates: api/aggregates.md
      - Computed fields and relationships: api/computed.md
      - Writing: api/writing.md
      - Procedures and functions: api/rpc.md
      - Formats, OpenAPI and errors: api/formats-errors.md
      - Realtime events: api/events.md
  - Reference:
      - Security and roles: references/security.md
      - Configuration: references/configuration.md
      - Schema cache: references/schema-cache.md
      - Schemas (Firebird 6, experimental): references/schemas.md
      - Deployment: references/deployment.md
      - Monitoring: references/observability.md
      - Stability promise: references/stability.md
  - Upgrading: upgrading.md
  - Benchmarks: benchmarks.md
  - Differences from PostgREST: postgrest.md
  - Changelog: changelog.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true

validation:
  links:
    not_found: warn
    anchors: warn
