# FirebirdREST configuration. Every setting can also be given as an
# environment variable (db-uri -> FBREST_DB_URI); see
# https://mariuz.github.io/firebirdrest/references/configuration/
#
# Check it with:   firebirdrest -check /etc/firebirdrest/firebirdrest.conf
# Then start with: systemctl enable --now firebirdrest
# Apply changes:   systemctl restart firebirdrest (settings)
#                  systemctl reload firebirdrest  (TLS certificate and schema cache)

# The database, as a user that may switch to the API's roles
# (GRANT web_anon TO USER authenticator, ...).
db-uri = "authenticator:change-me@localhost:3050/var/lib/firebird/data/app.fdb"

# The role of requests without a token; remove to require a token.
db-anon-role = "web_anon"

# The secret, key, JWK or JWKS that signs your tokens (or jwt-jwks-url).
#jwt-secret = "@/etc/firebirdrest/jwt-secret"

server-host = "127.0.0.1"
server-port = 3000

# HTTPS without a reverse proxy: a PEM certificate chain and key readable by
# the firebirdrest user. `systemctl reload firebirdrest` picks up a renewal.
#server-tls-cert = "/etc/firebirdrest/tls/fullchain.pem"
#server-tls-key = "/etc/firebirdrest/tls/privkey.pem"

# Health checks and Prometheus metrics on a separate, local port.
# /live and /ready are open; /reload and /metrics need the token when one is set.
#admin-server-port = 3001
#admin-server-host = "127.0.0.1"
#admin-server-token = "@/etc/firebirdrest/admin-token"

#db-pool = 10
#db-max-rows = 1000
#server-cors-allowed-origins = "https://app.example.com"
#log-level = "info"
